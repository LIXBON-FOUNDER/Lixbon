name: lixbon
description: App Android de Lixbon (chat, historial, uso y cuenta).
publish_to: 'none'

# Igual que el desktop: la versión visible vive aquí y el tag mobile-vX.Y.Z
# debe coincidir (el CI lo comprueba antes de publicar).
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  crypto: ^3.0.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  flutter_web_auth_2: ^5.0.0
  flutter_svg: ^2.0.16
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: BrunoAceSC
      fonts:
        - asset: fonts/BrunoAceSC-Regular.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: fonts/BricolageGrotesque-Regular.ttf
        - asset: fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: fonts/BricolageGrotesque-Bold.ttf
          weight: 700
