<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var t = 'dark';
        try {
          var p = localStorage.getItem('lixbon-theme');
          if (p === 'light') t = 'light';
          else if (p === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lixbon</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
