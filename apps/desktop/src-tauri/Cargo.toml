[package]
name = "lixbon"
version = "2.2.0"
description = "Lixbon"
authors = ["Lixbon by GBX"]
edition = "2021"
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lixbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools`: habilita el inspector (Ctrl+Shift+I) también en builds de release,
# para poder diagnosticar errores de la UI en la app instalada.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
vt100 = "0.16"
notify = "6"
regex = "1"
# Walker de ripgrep: respeta el .gitignore del proyecto en búsqueda/listado.
ignore = "0.4"
# Papelera del SO para delete_entry (borrar deja de ser irreversible).
trash = "5"
# Almacén SQLite del Core (módulo `store`, slice B). SQLite va incluido (3.46):
# no depende de la del sistema y `STRICT` exige >= 3.37.
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-http = "~2.6"
tauri-plugin-single-instance = "2"
# Catálogo de skills: paquete zip verificado por sha256 (Ajustes › Skills).
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.23"
getrandom = "0.3"
ring = "0.17"
# Borra de memoria los secretos del almacén seguro al soltarlos (ya compilado
# como dependencia de keyring).
zeroize = "1"

# Windows Credential Manager para guardar la API key cifrada (DPAPI) en vez
# de en claro en el JSON de settings. Solo Windows: en otros SO el frontend
# cae al JSON de siempre.
[target.'cfg(windows)'.dependencies]
# `orch/fsio.rs` (publicación durable del marcador de autoridad y del espejo) y `proctable.rs` (tabla de procesos para
# comprobar que murió TODO el árbol de un agente e identificar cada proceso: ToolHelp y Threading).
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }
keyring = { version = "3", features = ["windows-native"] }

# Almacén seguro multiplataforma (slice J1, módulo `secure_store`): el mismo
# crate `keyring` con el backend nativo de cada SO. Los comandos `secret_*` de
# lib.rs siguen siendo solo-Windows y no cambian.
# Linux usa Secret Service por libdbus: `tao` ya exige libdbus-1-dev, así que no
# añade requisitos del sistema; `crypto-rust` evita depender de OpenSSL.
# `proctable.rs` (Unix): `waitid(WNOWAIT)` para esperar a la raíz de un agente SIN reapearla y poder anotar su grupo de
# procesos mientras sigue ocupando su pid. Ya está en el árbol de dependencias (portable-pty, keyring...).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }


[dev-dependencies]
# MockRuntime para probar cómo llegan los argumentos de los comandos por IPC.
tauri = { version = "2", features = ["test"] }
