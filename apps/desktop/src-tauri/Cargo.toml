[package]
name = "lixbon"
version = "0.9.2"
description = "Lixbon"
authors = ["Lixbon by GBX"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lixbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools`: habilita el inspector (Ctrl+Shift+I) también en builds de release,
# para poder diagnosticar errores de la UI en la app instalada.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "6"
regex = "1"
# Walker de ripgrep: respeta el .gitignore del proyecto en búsqueda/listado.
ignore = "0.4"
# Papelera del SO para delete_entry (borrar deja de ser irreversible).
trash = "5"

# Windows Credential Manager para guardar la API key cifrada (DPAPI) en vez
# de en claro en el JSON de settings. Solo Windows: en otros SO el frontend
# cae al JSON de siempre.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

