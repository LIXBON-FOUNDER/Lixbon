.marco{max-width:1440px;margin:0 auto;padding:40px 32px 64px;display:flex;flex-direction:column;gap:28px}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:38px;padding:0 14px;border:0;border-radius:8px;background:var(--campo);cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--hover)}
.btn.prim{background:var(--ink);color:var(--bg)}
.btn.prim:hover{background:var(--muted)}
.seg{display:inline-flex;background:var(--campo);border-radius:8px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border:0;border-radius:6px;background:none;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--act);color:var(--ink)}
.buscar{height:38px;width:260px;max-width:100%;border:0;border-radius:8px;background:var(--campo);padding:0 12px;font-size:14px}
.buscar::placeholder{color:var(--muted)}
.cuerpo{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.lista{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:28px}
.grupo h2{margin:0 0 12px;font-size:15px;font-weight:600}
.grupo h2 span{color:var(--muted);font-weight:400}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ficha{height:112px;border:0;border-radius:12px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px}
.ficha:hover{background:var(--campo)}
.ficha[aria-current=true]{background:var(--act)}
.ficha span{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{flex:1 1 320px;max-width:380px;background:var(--card);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px;position:sticky;top:16px}
.vista{height:180px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:28px}
.dato{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--linea)}
.dato b{font-weight:500;color:var(--muted)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.acciones{display:flex;flex-direction:column;gap:8px}
.acciones .btn{justify-content:center}
.aviso{font-size:13px;color:var(--muted);min-height:18px}
.vacio{color:var(--muted);font-size:14px}
@media (max-width:720px){.panel{max-width:none;position:static}}

elva a empezar.\nexport function usePulso() {\n  const [n, setN] = useState(0);\n  const pulsar = useCallback(() => setN((v) => v + 1), []);\n  return [n === 0 ? '' : n % 2 ? 'p1' : 'p2', pulsar];\n}\n","iconos-lixbon/react/iconos-lixbon-datos.js":"// Generado: marcado de cada icono (línea y relleno). No editar a mano.\nexport default {\n \"chat\": {\n  \"linea\": \"\u003cg class=\\\"pt-all\\\">\u003cpath d=\\\"M12 4c4.97 0 9 3.36 9 7.5S16.97 19 12 19c-1.1 0-2.15-.16-3.12-.46l-4.28 1.4a.6.6 0 0 1-.75-.76l1.18-3.53C3.77 14.4 3 13 3 11.5 3 7.36 7.03 4 12 4Z\\\"/>\u003c/g>\",\n  \"relleno\": \"\u003cg class=\\\"pt-all\\\">\u003cg class=\\\"sol\\\">\u003cpath class=\\\"s\\\" d=\\\"M12 4c4.97 0 9 3.36 9 7.5S16.97 19 12 19c-1.1 0-2.15-.16-3.12-.46l-4.28 1.4a.6.6 0 0 1-.75-.76l1.18-3.53C3.77 14.4 3 13 3 11.5 3 7.36 7.03 4 12 4Z\\\"/>\u003c/g>\u003c/g>\"\n },\n \"visuals\": {\n  \"linea\": \"\u003cg class=\\\"pt-all\\\">\u003cg class=\\\"pt pt-pincel\\\">\u003cpath d=\\\"M10.7 12.3 17.7 5.3a2.05 2.05 0 0 1 2.9 2.9L13.7 15.1\\\"/>\u003c/g>\u003cg class=\\\"pt pt-pincel\\\">\u003cpath d=\\\"M10.7 12.3c-2.5-.3-4.5 1.3-4.7 3.7-.1 1.6-.8 2.9-2 3.6 1.3.9 2.9 1.4 4.4 1.4 3.2 0 5.5-2.4 5.3-5.9\\\"/>\u003c/g>\u003cg class=\\\"pt pt-chispa\\\">\u003cpath d=\\\"M6.36 3.43Q6.5 2.9 6.64 3.43L7.1 5.23Q7.24 5.76 7.77 5.9L9.57 6.36Q10.1 6.5 9.57 6.64L7.77 7.1Q7.24 7.24 7.1 7.77L6.64 9.57Q6.5 10.1 6.36 9.57L5.9 7.77Q5.76 7.24 5.23 7.1L3.43 6.64Q2.9 6.5 3.43 6.36L5.23 5.9Q5.76 5.76 5.9 5.23Z\\\"/>\u003c/g>\u003c/g>\",\n  \"relleno\": \"\u003cdefs>\u003cmask id=\\\"lx__ID__a\\\" maskUnits=\\\"userSpaceOnUse\\\" x=\\\"-2\\\" y=\\\"-2\\\" width=\\\"28\\\" height=\\\"28\\\">\u003cg class=\\\"mk\\\">\u003crect class=\\\"mw\\\" x=\\\"-2\\\" y=\\\"-2\\\" width=\\\"28\\\" height=\\\"28\\\"/>\u003cpath class=\\\"k\\\" d=\\\"M10.7 12.3 13.7 15.1\\\"/>\u003c/g>\u003c/mask>\u003c/defs>\u003cg class=\\\"pt-all\\\">\u003cg class=\\\"sol\\\" mask=\\\"url(#lx__ID__a)\\\">\u003cg class=\\\"pt pt-pincel\\\">\ ransform:rotate(-60deg) scale(.8);opacity:0}100%{transform:rotate(0) scale(1);opacity:1}}@keyframes tema-ptall-81-2{0%{transform:rotate(-60deg) scale(.8);opacity:0}100%{transform:rotate(0) scale(1);opacity:1}}\n.ia-tema .pt-all{transform-origin:12px 12px}\n.ia-tema:not(.on).p1 .v-off .pt-all{animation:tema-ptall-81-1 520ms cubic-bezier(.25,1,.5,1) 0ms both}\n.ia-tema:not(.on).p2 .v-off .pt-all{animation:tema-ptall-81-2 520ms cubic-bezier(.25,1,.5,1) 0ms both}\n@keyframes reproducir-ptall-82-1{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes reproducir-ptall-82-2{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}\n.ia-reproducir .pt-all{transform-origin:12px 12px}\n.ia-reproducir.on.p1 .v-on .pt-all{animation:reproducir-ptall-82-1 320ms cubic-bezier(.25,1,.5,1) 0ms both}\n.ia-reproducir.on.p2 .v-on .pt-all{animation:reproducir-ptall-82-2 320ms cubic-bezier(.25,1,.5,1) 0ms both}\n@keyframes reproducir-ptall-83-1{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes reproducir-ptall-83-2{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}\n.ia-reproducir .pt-all{transform-origin:12px 12px}\n.ia-reproducir:not(.on).p1 .v-off .pt-all{animation:reproducir-ptall-83-1 320ms cubic-bezier(.25,1,.5,1) 0ms both}\n.ia-reproducir:not(.on).p2 .v-off .pt-all{animation:reproducir-ptall-83-2 320ms cubic-bezier(.25,1,.5,1) 0ms both}\n@keyframes copiar-ptall-84-1{0%{stroke-dashoffset:21}100%{stroke-dashoffset:0}}@keyframes copiar-ptall-84-2{0%{stroke-dashoffset:21}100%{stroke-dashoffset:0}}\n.ia-copiar .pt-all{transform-origin:12px 12px}\n.ia-copiar.on.p1 .v-on .pt-all{stroke-dasharray:21;animation:copiar-ptall-84-1 420ms cubic-bezier(.25,1,.5,1) 0ms both}\n.ia-copiar.on.p2 .v-on .pt-all{stroke-dasharray:21;animation:copiar-ptall-84-2 420ms cubic-bezier(.25,1,.5,1) 0ms both}\n@keyframes copiar-ptall-85-1{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes copiar-ptall-85-2{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}\n.ia-copiar .pt-all{transform-origin:12px 12px}\n.ia-copiar:not(.on).p1 .v-off .pt-all{animation:copiar-ptall-85-1 320ms cubic-bezier(.25,1,.5,1) 0ms both}\n.ia-copiar:not(.on).p2 .v-off .pt-all{animation:copiar-ptall-85-2 320ms cubic-bezier(.25,1,.5,1) 0ms both}\n.ia-menu .pt{transform-origin:12px 12px;transition:transform 340ms cubic-bezier(.25,1,.5,1),opacity 220ms cubic-bezier(.25,1,.5,1)}\n.ia-menu.on .l1{transform:rotate(45deg) translateY(5px)}\n.ia-menu.on .l2{transform:scaleX(.2);opacity:0}\n.ia-menu.on .l3{transform:rotate(-45deg) translateY(-5px)}\n.ia-abajo .pt-all{transform-origin:12px 12px;transition:transform 300ms cubic-bezier(.25,1,.5,1)}.ia-abajo.on .pt-all{transform:rotate(180deg)}\n.ia-panel .pt-relleno{transform-origin:3px 12px;transform:scaleX(0);transition:transform 320ms cubic-bezier(.25,1,.5,1)}.ia-panel.on .pt-relleno{transform:scaleX(1)}\n.ia-panel-der .pt-relleno{transform-origin:21px 12px;transform:scaleX(0);transition:transform 320ms cubic-bezier(.25,1,.5,1)}.ia-panel-der.on .pt-relleno{transform:scaleX(1)}\n.ia-panel-inf .pt-relleno{transform-origin:12px 20px;transform:scaleY(0);transition:transform 320ms cubic-bezier(.25,1,.5,1)}.ia-panel-inf.on .pt-relleno{transform:scaleY(1)}\n\n@media (prefers-reduced-motion: reduce){.ia *{animation:none !important;transition:none !important}}\n","iconos-lixbon/LEEME.md":"# Iconos de Lixbon\n\n145 iconos para la web, el IDE y el móvil. Rejilla de 24, trazo 2, uniones y extremos redondos, esquinas redondeadas y al menos 2 px de aire entre trazos. 35 tienen gemela rellena para el estado activo.\n\n## Carpetas\n\n- `svg/linea/`: todos los iconos en línea, con `currentColor` (toman el color del texto).\n- `svg/relleno/`: las gemelas rellenas, con `currentColor`.\n- `svg/relleno-oscuro/`: rellenas en #FFFFFF, para el modo oscuro y para Figma.\n- `svg/relleno-claro/`: rellenas en #000000, para el modo claro.\n- `iconos-lixbon.json`: id, nombre, grupo, apps y el SVG de cada uno.\n- `react/`: componente `\u003cIcono>`, el hook `usePulso()` y el CSS con las animaciones al pulsar.\n- `galeria.html`: abre en el navegador para buscar, copiar y descargar cada icono.\n\n## Colores\n\nLa línea usa el color del texto. El relleno va en #FFFFFF en oscuro y #000000 en claro: en React pon `--lx-relleno: #000000` en el tema claro. Lo calado queda transparente.\n\n## Animaciones\n\nSolo al pulsar, nunca al pasar el cursor. Se mueve el icono, no el botón. Suaves, sin rebotes, de 300 a 900 ms, y se apagan con «reducir movimiento».\n\nAl pulsar: el botón lleva `ia ia-\u003cid>` más la clase que devuelve `usePulso()`.\nInterruptores (flash, ojo, favorito, me gusta, fijar, grabar, candado, tema, reproducir, copiar): el botón lleva `ia ia-\u003cinterruptor>`, `on` cuando está activo y la clase de `usePulso()`; dentro, el estado apagado en `\u003cspan class=\"v-off\">` y el encendido en `\u003cspan class=\"v-on\">`.\n\n| Interruptor | Apagado | Encendido |\n| --- | --- | --- |\n| flash | flash-off | rayo (relleno) |\n| ojo | ojo | ojo-off |\n| estrella | estrella | estrella (relleno) |\n| corazon | corazon | corazon (relleno) |\n| fijar | fijar | fijar (relleno) |\n| microfono | microfono | microfono (relleno) |\n| candado | candado | abierto |\n| tema | claro | oscuro |\n| reproducir | reproducir | pausa |\n| copiar | copiar | hecho |\n\nGitHub es la marca original y no se ha redibujado.\n"};
const GRUPOS = {"secciones":"Secciones","cuenta":"Cuenta y tema","ide":"IDE y Team","acciones":"Acciones","navegacion":"Navegación","archivos":"Archivos","desarrollo":"Desarrollo","media":"Media","estado":"Estado"};
let estilo = 'linea', sel = ICONOS.find((i) => i.id === 'visuals'), pulsos = 0;
const $ = (s) => document.querySelector(s);
const aviso = (t) => { $('#aviso').textContent = t; };

// Guardar: en claude.ai pasa por la capacidad de descargas; en local, enlace normal.
let descargas = null;
if (window.claude && window.claude.use) window.claude.use('downloads').then((d) => { descargas = d; }).catch(() => {});
async function guardar(nombre, datos) {
  try {
    if (descargas) { await descargas.save({ filename: nombre, data: datos }); aviso('Descargado: ' + nombre); return; }
    const url = URL.createObjectURL(datos instanceof Blob ? datos : new Blob([datos], { type: 'image/svg+xml' }));
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    aviso('Descargado: ' + nombre);
  } catch (e) {
    aviso(e && e.code === 'declined' ? 'Descarga cancelada' : 'No se pudo descargar aquí: usa «Copiar SVG»');
  }
}
async function copiar(texto, que) {
  try { await navigator.clipboard.writeText(texto); aviso(que + ' copiado'); } catch (e) { aviso('No se pudo copiar'); }
}
const svgDe = (id, carpeta) => FICHEROS['iconos-lixbon/svg/' + carpeta + '/' + id + '.svg'];

function pintarLista() {
  const q = $('#q').value.trim().toLowerCase();
  const filtro = (i) => (estilo === 'linea' || i.vr) && (!q || (i.id + ' ' + i.nombre).toLowerCase().includes(q));
  const html = Object.keys(GRUPOS).map((g) => {
    const xs = ICONOS.filter((i) => i.grupo === g && filtro(i));
    if (!xs.length) return '';
    return '<section class="grupo"><h2>' + GRUPOS[g] + ' <span>' + xs.length + '</span></h2><div class="rejilla">' + xs.map((i) =>
      '<button type="button" class="ficha ia ia-' + i.id + '" data-id="' + i.id + '" aria-current="' + (sel && sel.id === i.id) + '">' + (estilo === 'relleno' ? i.vr : i.v) + '<span>' + i.nombre + '</span></button>').join('') + '</div></section>';
  }).join('');
  $('#lista').innerHTML = html || '<p class="vacio">Ningún icono coincide con la búsqueda</p>';
}

function pintarPanel() {
  const i = sel;
  if (!i) { $('#panel').innerHTML = '<p class="vacio">Elige un icono</p>'; return; }
  const big = (s) => s.replace(/width="32" height="32"/, 'width="96" height="96"');
  const p = pulsos === 0 ? '' : pulsos % 2 ? 'p1' : 'p2';
  $('#panel').innerHTML =
    '<button type="button" class="vista ia ia-' + i.id + ' ' + p + '" id="vista" aria-label="Reproducir la animación de ' + i.nombre + '" style="border:0;cursor:pointer;width:100%">' + big(i.v) + (i.vr ? big(i.vr) : '') + '</button>' +
    '<div><div class="dato"><b>Nombre</b><span>' + i.nombre + '</span></div><div class="dato"><b>Id</b><span class="mono">' + i.id + '</span></div><div class="dato"><b>Apps</b><span>' + i.apps.join(' · ') + '</span></div><div class="dato"><b>Pulsar</b><span>' + (i.anim ? 'Tiene animación: pulsa la vista' : 'Sin animación') + '</span></div></div>' +
    '<div class="acciones">' +
    '<button type="button" class="btn prim" data-bajar="linea">Descargar SVG de línea</button>' +
    (i.vr ? '<button type="button" class="btn" data-bajar="relleno-oscuro">Descargar relleno #FFFFFF</button><button type="button" class="btn" data-bajar="relleno-claro">Descargar relleno #000000</button>' : '') +
    '<button type="button" class="btn" data-copiar="svg">Copiar SVG</button>' +
    '<button type="button" class="btn" data-copiar="jsx">Copiar JSX</button>' +
    '</div>';
}

document.addEventListener('click', (e) => {
  const f = e.target.closest('.ficha');
  if (f) {
    sel = ICONOS.find((i) => i.id === f.dataset.id);
    f.classList.remove('p1', 'p2'); void f.offsetWidth; f.classList.add('p1');
    document.querySelectorAll('.ficha[aria-current=true]').forEach((x) => x.setAttribute('aria-current', 'false'));
    f.setAttribute('aria-current', 'true');
    pulsos = 0; pintarPanel(); return;
  }
  if (e.target.closest('#vista')) { pulsos++; pintarPanel(); return; }
  const b = e.target.closest('[data-bajar]');
  if (b) { const c = b.dataset.bajar; guardar(sel.id + (c === 'linea' ? '' : '-' + c) + '.svg', svgDe(sel.id, c)); return; }
  const c = e.target.closest('[data-copiar]');
  if (c) {
    if (c.dataset.copiar === 'svg') copiar(svgDe(sel.id, estilo === 'relleno' && sel.vr ? 'relleno' : 'linea'), 'SVG');
    else copiar('<Icono nombre="' + sel.id + '"' + (estilo === 'relleno' && sel.vr ? ' relleno' : '') + ' />', 'JSX');
    return;
  }
  const s = e.target.closest('[data-estilo]');
  if (s) { estilo = s.dataset.estilo; document.querySelectorAll('[data-estilo]').forEach((x) => x.setAttribute('aria-pressed', x === s)); pintarLista(); return; }
  const t = e.target.closest('[data-tema]');
  if (t) { document.body.classList.toggle('claro', t.dataset.tema === 'claro'); document.querySelectorAll('[data-tema]').forEach((x) => x.setAttribute('aria-pressed', x === t)); }
});
$('#q').addEventListener('input', pintarLista);
$('#todo').addEventListener('click', async () => {
  if (!window.JSZip) { aviso('No se pudo cargar el compresor: descarga los iconos de uno en uno'); return; }
  aviso('Preparando el .zip…');
  const zip = new JSZip();
  Object.entries(FICHEROS).forEach(([ruta, txt]) => zip.file(ruta, txt));
  const blob = await zip.generateAsync({ type: 'blob' });
  guardar('iconos-lixbon.zip', blob);
});
pintarLista(); pintarPanel();
</script>
</body>
