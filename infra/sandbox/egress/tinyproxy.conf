Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Notice
MaxClients 200
DisableViaHeader Yes
# Solo lo que está en la lista; con FilterURLs se compara la URL entera
# (http://host:puerto/… o host:puerto en un CONNECT), así el gateway local
# solo es accesible en su puerto y nada más del anfitrión.
FilterDefaultDeny Yes
FilterURLs On
FilterType ere
Filter "/etc/tinyproxy/allowlist.txt"
# HTTPS solo al 443.
ConnectPort 443
