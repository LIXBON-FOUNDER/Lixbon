name: Mobile E2E (emulador)

# Prueba la app en un Android de verdad (emulador x86_64) contra un gateway
# simulado (apps/mobile/e2e): teclado, chat y control remoto. Deja las capturas
# y lo que la app envió como artefacto. Se lanza a mano o empujando una rama e2e/…
on:
  workflow_dispatch:
  push:
    branches:
      - 'e2e/**'

env:
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_BASE: http://10.0.2.2:8765

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Android platform
        run: npx expo prebuild --platform android --no-install

      # Solo en esta build: el gateway simulado habla HTTP plano.
      - name: Allow cleartext to the mock gateway
        run: sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml

      - name: Build APK (x86_64)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=x86_64

      - name: Start mock gateway
        run: |
          mkdir -p e2e-out
          MOCK_LOG=e2e-out/prompts.jsonl nohup python3 e2e/mock_gateway.py > e2e-out/mock.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8765/api/auth/me

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            python3 e2e/drive.py e2e-out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e
          path: apps/mobile/e2e-out
