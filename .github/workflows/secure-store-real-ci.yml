name: Secure Store · real OS backends

# Ejecuta solamente las dos pruebas ignoradas que escriben en el almacén
# nativo de cada runner. Linux levanta GNOME Keyring como Secret Service real.
on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/lxo/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/package-lock.json'
      - 'apps/desktop/scripts/build-lxo.mjs'
      - '.github/scripts/run-secure-store-real-linux.sh'
      - '.github/workflows/secure-store-real-ci.yml'
  push:
    branches: [master]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/lxo/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/package-lock.json'
      - 'apps/desktop/scripts/build-lxo.mjs'
      - '.github/scripts/run-secure-store-real-linux.sh'
      - '.github/workflows/secure-store-real-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-store-real-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  real-store:
    name: Real OS store · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/desktop/lxo -> target

      # Incluye el Secret Service real de GNOME, D-Bus de sesión y las
      # dependencias que Tauri necesita para compilar la biblioteca en Linux.
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev \
            dbus-daemon dbus-x11 gnome-keyring

      - name: Instalar dependencias de npm
        run: npm ci

      # tauri-build valida el frontendDist y el sidecar declarados en tauri.conf.json.
      - name: Compilar el sidecar lxo
        run: npm run build:lxo

      - name: Compilar el frontend
        run: npm run build

      - name: Probar almacén real (Linux · Secret Service)
        if: runner.os == 'Linux'
        working-directory: .
        run: bash .github/scripts/run-secure-store-real-linux.sh

      - name: Probar almacén real (macOS · Keychain)
        if: runner.os == 'macOS'
        working-directory: .
        run: cargo test --locked --lib --manifest-path apps/desktop/src-tauri/Cargo.toml secure_store::os::real_tests -- --ignored --test-threads=1

      - name: Probar almacén real (Windows · Credential Manager)
        if: runner.os == 'Windows'
        working-directory: .
        run: cargo test --locked --lib --manifest-path apps/desktop/src-tauri/Cargo.toml secure_store::os::real_tests -- --ignored --test-threads=1
