name: Compile & Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './apps/desktop/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: |
          cd "apps/desktop"
          npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-folax-v__VERSION__
          releaseName: 'App Folax v__VERSION__'
          releaseBody: 'Autogenerated desktop installers for Windows.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'

      - name: Upload compiled MSI to server
        shell: pwsh
        run: |
          $MSI_PATH = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($MSI_PATH) {
            Write-Host "Uploading $($MSI_PATH.Name) to remote server..."
            # Versión: preferir el tag de git (vX.Y.Z) para que coincida con el release;
            # si no hay tag (ej. workflow_dispatch), caer al package.json.
            $Ref = "${{ github.ref_name }}"
            if ($Ref -match '^v?(\d+\.\d+\.\d+.*)$') {
              $Version = $Matches[1]
            } else {
              $PackageJson = Get-Content -Raw -Path "apps/desktop/package.json" | ConvertFrom-Json
              $Version = $PackageJson.version
            }
            # Canal: beta si el tag lo indica (v1.2.3-beta / -rc), si no stable.
            if ($Version -match '(?i)beta|rc') { $Channel = "beta" } else { $Channel = "stable" }
            Write-Host "Version=$Version Channel=$Channel"

            # Intentar obtener la firma de Tauri (.msi.sig)
            $SIG_PATH = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig" | Select-Object -First 1
            $Signature = ""
            if ($SIG_PATH) {
              Write-Host "Found signature file $($SIG_PATH.Name)"
              $Signature = Get-Content -Raw -Path $SIG_PATH.FullName
              $Signature = $Signature.Trim()
            } else {
              Write-Warning "No signature file (.sig) found for the MSI installer."
            }

            # Obtener los últimos 3 mensajes de commits como changelog real
            $GitCommits = git log -n 3 --pretty=format:"%s"
            if ($GitCommits) {
              $ChangelogArray = $GitCommits -split "`n"
              $ChangelogJson = ConvertTo-Json $ChangelogArray -Compress
            } else {
              $ChangelogJson = "[`"Compilación automática desde GitHub Actions`"]"
            }
            
            # Petición multipart form para subir el instalador a la API del servidor.
            # --fail-with-body: sin esto, un 4xx/5xx (o el 530 de un tunnel caído)
            # deja el job en verde y el instalador nunca llega al servidor.
            curl.exe --fail-with-body --show-error -X POST `
              -H "X-Admin-Token: ${{ secrets.FOLAX_ADMIN_TOKEN }}" `
              -F "version=$Version" `
              -F "channel=$Channel" `
              -F "title=App Folax v$Version" `
              -F "changelog=$ChangelogJson" `
              -F "checksum_sha256=$Signature" `
              -F "file=@$($MSI_PATH.FullName)" `
              "${{ vars.FOLAX_SERVER_URL || 'https://llm-datacent-production.up.railway.app' }}/api/versions/upload"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "La subida del instalador al servidor falló (exit $LASTEXITCODE)."
              exit 1
            }
          } else {
            Write-Warning "No MSI installer found to upload."
          }
