name: Compile & Release Tauri App

# Revivido: apps/desktop volvió a ser la app oficial bajo el producto
# `desktop` (reemplaza a Lixbon IDE, que quedó descontinuada — ver
# apps/desktop/README.md). Tag prefix propio (desktop-v*), igual que
# mobile.yml usa mobile-v*, para no chocar con otros tags del monorepo.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          # macOS: build universal (Apple Silicon + Intel) en un solo .dmg.
          # Sin firma de Apple por ahora: Gatekeeper pedirá abrir con clic
          # derecho → Abrir la primera vez.
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './apps/desktop/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: |
          cd "apps/desktop"
          npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-lixbon-v__VERSION__
          releaseName: 'App lixbon v__VERSION__'
          releaseBody: 'Autogenerated desktop installers for Windows and macOS.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: './apps/desktop'

      - name: Upload compiled MSI to server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $MSI_PATH = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($MSI_PATH) {
            Write-Host "Uploading $($MSI_PATH.Name) to remote server..."
            # Versión: SIEMPRE la de tauri.conf.json — es la que Tauri estampa en el
            # MSI y la que reporta la app instalada. Usar otra fuente (tag o
            # package.json) puede registrar en el servidor una versión que no
            # coincide con el binario y provoca un bucle de "actualización
            # disponible" imposible de satisfacer.
            $TauriConf = Get-Content -Raw -Path "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json
            $Version = $TauriConf.version
            # Si hay tag, exigir que coincida con tauri.conf.json para no publicar
            # un release cuyo nombre no corresponde al binario.
            $Ref = "${{ github.ref_name }}"
            if ($Ref -match '^desktop-v(\d+\.\d+\.\d+.*)$' -and $Matches[1] -ne $Version) {
              Write-Error "El tag ($Ref) no coincide con la version de tauri.conf.json ($Version). Alinea ambos antes de publicar."
              exit 1
            }
            # Canal: beta si el tag lo indica (desktop-v1.2.3-beta / -rc), si no stable.
            if ($Version -match '(?i)beta|rc') { $Channel = "beta" } else { $Channel = "stable" }
            Write-Host "Version=$Version Channel=$Channel"

            # Intentar obtener la firma de Tauri (.msi.sig)
            $SIG_PATH = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig" | Select-Object -First 1
            $Signature = ""
            if ($SIG_PATH) {
              Write-Host "Found signature file $($SIG_PATH.Name)"
              $Signature = Get-Content -Raw -Path $SIG_PATH.FullName
              $Signature = $Signature.Trim()
            } else {
              Write-Warning "No signature file (.sig) found for the MSI installer."
            }

            # Obtener los últimos 3 mensajes de commits como changelog real
            $GitCommits = git log -n 3 --pretty=format:"%s"
            if ($GitCommits) {
              $ChangelogArray = $GitCommits -split "`n"
              $ChangelogJson = ConvertTo-Json $ChangelogArray -Compress
            } else {
              $ChangelogJson = "[`"Compilación automática desde GitHub Actions`"]"
            }

            # Petición multipart form para subir el instalador a la API del servidor.
            # --fail-with-body: sin esto, un 4xx/5xx (o el 530 de un tunnel caído)
            # deja el job en verde y el instalador nunca llega al servidor.
            curl.exe --fail-with-body --show-error -X POST `
              -H "X-Admin-Token: ${{ secrets.LIXBON_ADMIN_TOKEN }}" `
              -F "version=$Version" `
              -F "channel=$Channel" `
              -F "title=App lixbon v$Version" `
              -F "changelog=$ChangelogJson" `
              -F "checksum_sha256=$Signature" `
              -F "file=@$($MSI_PATH.FullName)" `
              "${{ vars.LIXBON_SERVER_URL || 'https://lixbon.com' }}/api/versions/upload"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "La subida del instalador al servidor falló (exit $LASTEXITCODE)."
              exit 1
            }
          } else {
            Write-Warning "No MSI installer found to upload."
          }

      # ── macOS: sube el .dmg (descarga manual) y el .app.tar.gz firmado (updater) ──
      # Dos "productos" con la misma versión que el MSI: desktop-mac y
      # desktop-mac-updater. El gateway añade el segundo al manifest del updater.
      - name: Upload compiled DMG to server
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+.*)$ && "${BASH_REMATCH[1]}" != "$VERSION" ]]; then
            echo "El tag ($REF) no coincide con la version de tauri.conf.json ($VERSION)." >&2
            exit 1
          fi
          if echo "$VERSION" | grep -qiE 'beta|rc'; then CHANNEL=beta; else CHANNEL=stable; fi
          echo "Version=$VERSION Channel=$CHANNEL"

          CHANGELOG=$(git log -n 3 --pretty=format:"%s" | python3 -c 'import json,sys; print(json.dumps([l for l in sys.stdin.read().splitlines() if l]))')
          SERVER="${{ vars.LIXBON_SERVER_URL || 'https://lixbon.com' }}"

          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -n 1)
          TARGZ=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -n 1)
          SIG=$(tr -d '\n' < "$TARGZ.sig")

          upload() { # producto, archivo, firma
            curl --fail-with-body --show-error -X POST \
              -H "X-Admin-Token: ${{ secrets.LIXBON_ADMIN_TOKEN }}" \
              -F "version=$VERSION" -F "channel=$CHANNEL" -F "product=$1" \
              -F "title=App lixbon v$VERSION (macOS)" \
              -F "changelog=$CHANGELOG" -F "checksum_sha256=$3" \
              -F "file=@$2" "$SERVER/api/versions/upload"
          }
          upload desktop-mac "$DMG" ""
          upload desktop-mac-updater "$TARGZ" "$SIG"
