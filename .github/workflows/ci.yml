name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, cli]

jobs:
  gateway:
    name: Gateway · tests (un proceso por módulo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python infra/ci/gateway_tests.py

  cli-go:
    name: CLI Go · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o ${{ runner.temp }}/lixbon ./cmd/lixbon

  cli-install:
    name: CLI Go · instaladores · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python infra/ci/install_e2e.py
        env:
          PYTHONIOENCODING: utf-8
