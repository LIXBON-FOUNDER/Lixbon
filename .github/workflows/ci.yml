name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, cli]

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway · tests (un proceso por módulo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python infra/ci/gateway_tests.py

  cli-go:
    name: CLI Go · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o ${{ runner.temp }}/lixbon ./cmd/lixbon

  cli-install:
    name: CLI Go · instaladores · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python infra/ci/install_e2e.py
        env:
          PYTHONIOENCODING: utf-8

  lxo-events-e2e:
    name: lxo events · Core HTTP · Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/desktop/lxo -> target
      - run: npm ci
      - name: Construir sidecar y frontend requeridos por Tauri
        run: |
          npm run build:lxo
          npm run build
      - name: Ejecutar E2E de lxo contra el servidor HTTP del Core
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml orch::events_read_tests::lxo_bin_e2e_events_empty_history_pagination_and_follow_resume_no_duplicates -- --ignored --exact --nocapture
        env:
          LXO_BIN: ${{ github.workspace }}\apps\desktop\src-tauri\binaries\lxo-x86_64-pc-windows-msvc.exe
      - name: Ejecutar E2E de lxo attention contra el servidor HTTP del Core
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml orch::events_read_tests::lxo_bin_e2e_attention_question_appears_and_reply_resolves_it -- --ignored --exact --nocapture
        env:
          LXO_BIN: ${{ github.workspace }}\apps\desktop\src-tauri\binaries\lxo-x86_64-pc-windows-msvc.exe
      - name: Ejecutar E2E de lxo projects como persona (Credential Manager real)
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml orch::projects_overview_tests::lxo_bin_e2e_projects_person_real_store -- --ignored --exact --nocapture
        env:
          LXO_BIN: ${{ github.workspace }}\apps\desktop\src-tauri\binaries\lxo-x86_64-pc-windows-msvc.exe
