name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, cli]

jobs:
  cli:
    name: CLI · tests + artefacto al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest apps/cli/tests -q
